<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- フォルダのアウトライン用グラデーション -->
    <linearGradient id="folderEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- 飛び出す雷のネオングラデーション -->
    <linearGradient id="lightningGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0072FF" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- 発光グローフィルター -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. フォルダ背面（タブ部分） -->
  <path d="M 100 180 L 190 180 L 220 210 L 412 210 C 428 210 438 222 438 238 L 438 410 C 438 426 428 438 412 438 L 100 438 C 84 438 74 426 74 410 L 74 208 C 74 192 84 180 100 180 Z" 
        fill="#11111B" stroke="#45475A" stroke-width="6" />

  <!-- 2. フォルダ内部の発光エネルギー -->
  <ellipse cx="256" cy="245" rx="120" ry="26" fill="#00F2FE" opacity="0.3" filter="url(#glow)" />

  <!-- 3. 飛び出す稲妻 -->
  <polygon points="275,20 170,180 250,180 200,330 360,150 280,150" 
           fill="url(#lightningGrad)" opacity="0.6" filter="url(#glow)" />
  <polygon points="275,20 170,180 250,180 200,330 360,150 280,150" 
           fill="url(#lightningGrad)" />

  <!-- 4. フォルダ前面ポケット（背面を完全に覆うよう下部・横幅を拡張） -->
  <path d="M 64 230 L 448 230 C 462 230 472 242 466 256 L 436 438 C 430 452 418 462 400 462 L 112 462 C 94 462 82 452 76 438 L 46 256 C 40 242 50 230 64 230 Z" 
        fill="#181825" stroke="url(#folderEdge)" stroke-width="8" />

  <!-- 5. フォルダ前面のハイライトライン -->
  <path d="M 84 252 L 428 252" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.2" />
</svg>
